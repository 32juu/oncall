# 测试专用配置：数据源用内存 H2 并开启 MySQL 兼容模式（MODE=MySQL），贴近真库语义；
# 相关 @DataJpaTest 测试类需加 @AutoConfigureTestDatabase(replace = NONE) 以使用本配置而非默认替换。
spring:
  datasource:
    url: jdbc:h2:mem:claimtest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
